name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SQLX_OFFLINE: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
